# Builds the Vigor Android app (native/) whenever it changes. The APK is attached to the run
# as a download for people signed in to GitHub; nothing is published anywhere else.
name: Android app

on:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: native
    env:
      VIGOR_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo prebuild --platform android --no-install --clean
      - name: Build the APK
        working-directory: native/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
      - run: mv android/app/build/outputs/apk/release/app-release.apk vigor-android-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vigor-android-${{ github.run_number }}
          path: native/vigor-android-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30
